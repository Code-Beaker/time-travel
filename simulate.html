<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Time Simulation</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:black;overflow:hidden;font-family:Arial;color:white}

/* ROTATE */
#rotate{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:black;z-index:9999
}

/* VIDEO */
#videoStage{position:fixed;inset:0;z-index:1}
video{width:100vw;height:100vh;object-fit:cover}

/* COCKPIT */
#cockpit{position:fixed;inset:0;z-index:3;pointer-events:none}
#cockpit img{width:100%;height:100%;object-fit:cover}

/* AI */
#ai{position:fixed;bottom:20px;left:20px;z-index:4;max-width:60%}

/* CONTROLS */
#controls{position:fixed;bottom:20px;right:20px;z-index:4}
button{
  background:rgba(0,242,255,.2);
  border:1px solid #00f2ff;color:#00f2ff;
  padding:12px 18px;font-weight:bold;cursor:pointer;
}
button:hover{background:#00f2ff;color:black}

/* TIME OVERLAY */
#timeOverlay{
  position:fixed;inset:0;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  background:rgba(0,0,0,.4);
  opacity:0;transition:opacity 1.5s ease;
  z-index:5;pointer-events:none
}

#clock{
  width:220px;height:220px;border:2px solid white;
  border-radius:50%;position:relative
}

.hand{position:absolute;top:50%;left:50%;transform-origin:0% 50%;background:white}
.hour{width:35%;height:4px}
.minute{width:50%;height:3px}
.second{width:55%;height:2px;background:red}

.center-dot{
  width:8px;height:8px;background:white;border-radius:50%;
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)
}

#dateText{
  margin-top:20px;
  font-size:26px;
  letter-spacing:3px;
}

@media(orientation:landscape){#rotate{display:none}}
</style>
</head>

<body>

<div id="rotate"><h2>Rotate your device</h2></div>

<div id="videoStage">
  <video id="sceneVideo" playsinline muted preload="auto"></video>
</div>

<div id="cockpit">
  <img id="cockpitImg" src="images/cockpit_ground.png">
</div>

<div id="ai"><p id="aiText">System online.</p></div>

<div id="controls">
  <div id="pathBtns">
    <button onclick="selectPath('past')">PAST</button>
    <button onclick="selectPath('future')">FUTURE</button>
  </div>
  <div id="yearBtns" style="display:none">
    <div id="pastYears">
      <button onclick="selectYear(1897)">1897</button>
      <button onclick="selectYear(1987)">1987</button>
    </div>
    <div id="futureYears" style="display:none">
      <button onclick="selectYear(2050)">2050</button>
      <button onclick="selectYear(3079)">3079</button>
    </div>
  </div>
  <div id="goBtn" style="display:none">
    <button onclick="goBack()">← BACK</button>
    <button onclick="takeOff()">TAKE OFF 🚀</button>
  </div>
</div>

<div id="timeOverlay">
  <div id="clock">
    <div class="hand hour"></div>
    <div class="hand minute"></div>
    <div class="hand second"></div>
    <div class="center-dot"></div>
  </div>
  <div id="dateText">YEAR</div>
</div>

<audio id="clockSound" src="audio/clock.mp3" preload="auto"></audio>

<script>
const video=document.getElementById("sceneVideo");
const cockpit=document.getElementById("cockpit");
const cockpitImg=document.getElementById("cockpitImg");
const aiText=document.getElementById("aiText");

const timeOverlay=document.getElementById("timeOverlay");
const hourHand=document.querySelector(".hour");
const minuteHand=document.querySelector(".minute");
const secondHand=document.querySelector(".second");
const dateText=document.getElementById("dateText");

const clockSound=document.getElementById("clockSound");
clockSound.loop=true;

let chosenPath=null,chosenYear=null;
let clockInterval=null,yearCounter=0,clockDir=1,angle=0;

function selectPath(p){
  chosenPath=p;
  pathBtns.style.display="none";
  yearBtns.style.display="block";
  pastYears.style.display=p==="past"?"block":"none";
  futureYears.style.display=p==="future"?"block":"none";
}

function selectYear(y){
  chosenYear=y;
  yearBtns.style.display="none";
  goBtn.style.display="block";
}

function goBack(){
  goBtn.style.display="none";
  yearBtns.style.display="block";
}

function takeOff(){
  controls.style.display="none";
  cockpit.style.display="none";

  video.src="videos/launch.mp4";video.play();
  video.onended=()=>{
    video.src="videos/fly.mp4";video.play();
    video.onended=()=>{
      cockpit.style.display="block";
      cockpitImg.src="images/cockpit_overlay.png";

      video.src=chosenPath==="future"?"videos/blackhole.mp4":"videos/wormhole.mp4";
      video.play();

      clockDir=chosenPath==="future"?1:-1;
      yearCounter=chosenYear;

      setTimeout(startClock,5000);
    }
  }
}

function startClock(){
  timeOverlay.style.opacity="1";
  clockSound.play();
  dateText.innerText=yearCounter;

  clockInterval=setInterval(()=>{
    angle+=6*clockDir;
    secondHand.style.transform=`rotate(${angle}deg)`;
    minuteHand.style.transform=`rotate(${angle/12}deg)`;
    hourHand.style.transform=`rotate(${angle/144}deg)`;

    yearCounter+=clockDir*3;
    dateText.innerText=yearCounter;
  },80);

  setTimeout(stopClock,15000);
}

function stopClock(){
  clearInterval(clockInterval);
  clockSound.pause();
}
</script>

</body>
</html>
