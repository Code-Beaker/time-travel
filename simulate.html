<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Time Simulation</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:black;overflow:hidden;font-family:Arial;color:white}

/* VIDEO */
#videoStage{position:fixed;inset:0;z-index:1}
video{width:100vw;height:100vh;object-fit:cover}

/* COCKPIT */
#cockpit{position:fixed;inset:0;z-index:3;pointer-events:none}
#cockpit img{width:100%;height:100%;object-fit:cover}

/* AI */
#ai{
  position:fixed;
  bottom:20px;
  left:20px;
  z-index:4;
  max-width:65%;
  font-size:14px;
  opacity:.9;
}

/* CONTROLS */
#controls{position:fixed;bottom:20px;right:20px;z-index:4}
button{
  background:rgba(0,242,255,.25);
  border:1px solid #00f2ff;
  color:#00f2ff;
  padding:12px 18px;
  font-weight:bold;
  cursor:pointer;
}
button:hover{background:#00f2ff;color:black}

/* TIME OVERLAY */
#timeOverlay{
  position:fixed;inset:0;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  background:rgba(0,0,0,.45);
  opacity:0;
  transition:opacity 1.5s ease;
  z-index:5;
  pointer-events:none;
}

/* CLOCK (TRAVEL) */
#clock{
  width:240px;height:240px;
  border:2px solid white;
  border-radius:50%;
  position:relative;
}
.number{position:absolute;transform:translate(-50%,-50%);font-size:14px}
.hand{
  position:absolute;
  top:50%;left:50%;
  transform-origin:0% 50%;
  transform:translateY(-50%);
  background:white;
}
.hour{width:35%;height:4px}
.minute{width:50%;height:3px}
.second{width:50%;height:2px;background:red}
.center-dot{
  width:8px;height:8px;background:white;border-radius:50%;
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);
}
#dateText{margin-top:20px;font-size:24px;letter-spacing:2px}

/* FLASH */
#flashWhite,#flashBlue{
  position:fixed;inset:0;
  opacity:0;z-index:10;
  transition:.4s;
}
#flashWhite{background:white}
#flashBlue{background:#0b1c2d}

/* AI OVERRIDE */
#aiOverride{
  position:fixed;inset:0;
  background:rgba(0,0,0,.85);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:30;
}
#aiBox{max-width:420px}

/* MAGIC */
#magicOverlay{
  position:fixed;inset:0;
  background:radial-gradient(circle,#6a00ff,#00f2ff,#000);
  opacity:0;
  pointer-events:none;
  z-index:40;
  transition:.5s;
}
#magicOverlay.active{opacity:1}

/* RETRO TITLE */
#retroTitleWrap{
  position:fixed;
  top:40px;
  width:100%;
  text-align:center;
  z-index:60;
}
#retroTitle{
  font-size:42px;
  letter-spacing:4px;
  font-family:Courier, monospace;
  opacity:0;
}

/* RETRO CLOCK */
#retroClockWrap{
  margin-top:120px;
  opacity:0;
  transition:opacity 2s ease;
}
#retroClockWrap.active{opacity:1}

#retroClockFace{
  width:180px;height:180px;
  border:2px solid #ccc;
  border-radius:50%;
  margin:auto;
  position:relative;
}
.retroHand{
  position:absolute;
  top:50%;left:50%;
  transform-origin:0% 50%;
  transform:translateY(-50%);
  background:#ccc;
}
.retroHour{width:35%;height:4px}
.retroMinute{width:50%;height:3px}
.retroSecond{width:55%;height:2px;background:red}
.retroCenter{
  width:8px;height:8px;
  background:#ccc;
  border-radius:50%;
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
}
</style>
</head>

<body>

<div id="videoStage"><video id="sceneVideo" playsinline preload="auto"></video></div>
<div id="cockpit"><img id="cockpitImg" src="images/cockpit_ground.png"></div>
<div id="ai"><p id="aiText">System online.</p></div>

<div id="controls">
  <div id="pathBtns">
    <button onclick="selectPath('past')">PAST</button>
    <button onclick="selectPath('future')">FUTURE</button>
  </div>
  <div id="yearBtns" style="display:none">
    <div id="pastYears">
      <button onclick="selectYear(1897)">1897</button>
      <button onclick="selectYear(1987)">1987</button>
    </div>
    <div id="futureYears" style="display:none">
      <button onclick="selectYear(2050)">2050</button>
      <button onclick="selectYear(3079)">3079</button>
    </div>
  </div>
  <div id="goBtn" style="display:none">
    <button onclick="goBack()">← BACK</button>
    <button onclick="takeOff()">TAKE OFF 🚀</button>
  </div>
</div>

<div id="timeOverlay">
  <div id="clock">
    <div class="hand hour"></div>
    <div class="hand minute"></div>
    <div class="hand second"></div>
    <div class="center-dot"></div>
  </div>
  <div id="dateText"></div>
</div>

<div id="flashWhite"></div>
<div id="flashBlue"></div>

<div id="aiOverride">
  <div id="aiBox">
    <p id="aiOverrideText"></p>
    <button id="magicBtn">MAGIC 🪄</button>
  </div>
</div>

<div id="magicOverlay"></div>

<div id="retroTitleWrap"><div id="retroTitle"></div></div>

<div id="retroClockWrap">
  <div id="retroClockFace">
    <div class="retroHand retroHour"></div>
    <div class="retroHand retroMinute"></div>
    <div class="retroHand retroSecond"></div>
    <div class="retroCenter"></div>
  </div>
</div>

<audio id="clockSound" src="audio/clock.mp3"></audio>
<audio id="typeSound" src="audio/type.mp3"></audio>

<script>
const typeSound=document.getElementById("typeSound");
typeSound.volume=0.3;

function typeTitle(text,year){
  const t=document.getElementById("retroTitle");
  t.innerHTML="";t.style.opacity=1;
  t.style.color=year<1900?"#cfa66a":year<2000?"#00ff88":"#00f2ff";
  let i=0;
  const iv=setInterval(()=>{
    t.innerHTML+=text[i++];
    typeSound.currentTime=0;typeSound.play();
    if(i>=text.length){
      clearInterval(iv);
      typeSound.pause();
      setTimeout(startRetroClock,800);
    }
  },90);
}

function startRetroClock(){
  const wrap=document.getElementById("retroClockWrap");
  wrap.classList.add("active");
  const h=document.querySelector(".retroHour");
  const m=document.querySelector(".retroMinute");
  const s=document.querySelector(".retroSecond");
  let sec=0;
  setInterval(()=>{
    sec++;
    s.style.transform=`rotate(${sec*6}deg)`;
    m.style.transform=`rotate(${sec/10}deg)`;
    h.style.transform=`rotate(${sec/120}deg)`;
  },1000);
}

magicBtn.onclick=()=>{
  magicOverlay.classList.add("active");
  setTimeout(()=>{
    magicOverlay.classList.remove("active");
    aiOverride.style.display="none";
  },1400);
  setTimeout(()=>{
    typeTitle(`WELCOME TO ${chosenYear}`,chosenYear);
  },2400);
};
</script>

</body>
</html>
