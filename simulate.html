<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Time Simulation</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  #retroTitleWrap{
  position:fixed;
  top:40px;
  width:100%;
  text-align:center;
  z-index:60;
}

#retroTitle{
  font-size:42px;
  letter-spacing:4px;
  font-family:Courier, monospace;
  opacity:0;
  transition:color 1s ease;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:black;overflow:hidden;font-family:Arial;color:white}

/* VIDEO */
#videoStage{position:fixed;inset:0;z-index:1}
video{width:100vw;height:100vh;object-fit:cover}

/* COCKPIT */
#cockpit{position:fixed;inset:0;z-index:3;pointer-events:none}
#cockpit img{width:100%;height:100%;object-fit:cover}

/* AI */
#ai{
  position:fixed;
  bottom:20px;
  left:20px;
  z-index:4;
  max-width:65%;
  font-size:14px;
  opacity:.9;
}

/* CONTROLS */
#controls{position:fixed;bottom:20px;right:20px;z-index:4}
button{
  background:rgba(0,242,255,.25);
  border:1px solid #00f2ff;
  color:#00f2ff;
  padding:12px 18px;
  font-weight:bold;
  cursor:pointer;
}
button:hover{background:#00f2ff;color:black}

/* TIME OVERLAY */
#timeOverlay{
  position:fixed;
  inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.45);
  opacity:0;
  transition:opacity 1.5s ease;
  z-index:5;
  pointer-events:none;
}

/* CLOCK */
#clock{
  width:240px;height:240px;
  border:2px solid white;
  border-radius:50%;
  position:relative;
}
.number{position:absolute;transform:translate(-50%,-50%);font-size:14px}
.hand{
  position:absolute;
  top:50%;left:50%;
  transform-origin:0% 50%;
  transform:translateY(-50%);
  background:white;
}
.hour{width:35%;height:4px}
.minute{width:50%;height:3px}
.second{width:50%;height:2px;background:red}
.center-dot{
  width:8px;height:8px;background:white;border-radius:50%;
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);
}
#dateText{margin-top:20px;font-size:24px;letter-spacing:2px}

/* FLASHES */
#flashWhite,#flashBlue{
  position:fixed;inset:0;
  opacity:0;
  z-index:10;
  pointer-events:none;
  transition:opacity .4s ease;
}
#flashWhite{background:white}
#flashBlue{background:#0b1c2d}

/* 404 */
#notFound{
  position:fixed;inset:0;
  background:#111;
  color:#d0d0d0;
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  z-index:20;
}
#notFound h1{font-size:96px;margin-bottom:10px}
#notFound p{opacity:.7}

/* AI OVERRIDE */
#aiOverride{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.85);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:30;
}
#aiBox{max-width:420px}
#aiOverrideText{
  font-size:15px;
  line-height:1.6;
  margin-bottom:20px;
}
#magicBtn{
  background:linear-gradient(135deg,#6a00ff,#00f2ff);
  border:none;
  padding:12px 22px;
  font-weight:bold;
  cursor:pointer;
  border-radius:6px;
}

/* MAGIC OVERLAY */
#magicOverlay{
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at center,
      rgba(120,0,255,.45),
      rgba(0,242,255,.35),
      rgba(20,20,60,.95)
    );
  opacity:0;
  pointer-events:none;
  z-index:40;
  backdrop-filter: blur(0px);
  transition: opacity .4s ease, backdrop-filter .6s ease;
}
#magicOverlay.active{
  opacity:1;
  backdrop-filter: blur(14px);
}
  /* RETRO PAGE */
#retroPage{
  position:fixed;
  inset:0;
  background:black;
  color:white;
  display:none;
  align-items:center;
  justify-content:center;
  font-size:32px;
  font-weight:bold;
  letter-spacing:2px;
  z-index:50;
}
  #retroClockWrap{
  margin-top:30px;
  opacity:0;
  transition:opacity 1.5s ease;
}

#retroClockFace{
  width:180px;
  height:180px;
  border:2px solid #ccc;
  border-radius:50%;
  position:relative;
  margin:auto;
}

.retroHand{
  position:absolute;
  top:50%;
  left:50%;
  transform-origin:0% 50%;
  transform:translateY(-50%);
  background:#ccc;
}

.retroHour{width:35%;height:4px}
.retroMinute{width:50%;height:3px}
.retroSecond{width:55%;height:2px;background:red}

.retroCenter{
  width:8px;height:8px;
  background:#ccc;
  border-radius:50%;
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
}
  #retroClock{
  opacity:0;
  transition: opacity 2s ease;
}
#retroClock.active{
  opacity:1;
}
</style>
</head>

<body>

<div id="videoStage">
  <video id="sceneVideo" playsinline preload="auto"></video>
</div>

<div id="cockpit">
  <img id="cockpitImg" src="images/cockpit_ground.png">
</div>

<div id="ai"><p id="aiText">System online.</p></div>

<div id="controls">
  <div id="pathBtns">
    <button onclick="selectPath('past')">PAST</button>
    <button onclick="selectPath('future')">FUTURE</button>
  </div>

  <div id="yearBtns" style="display:none">
    <div id="pastYears">
      <button onclick="selectYear(1897)">1897</button>
      <button onclick="selectYear(1987)">1987</button>
    </div>
    <div id="futureYears" style="display:none">
      <button onclick="selectYear(2050)">2050</button>
      <button onclick="selectYear(3079)">3079</button>
    </div>
  </div>

  <div id="goBtn" style="display:none">
    <button onclick="goBack()">← BACK</button>
    <button onclick="takeOff()">TAKE OFF 🚀</button>
  </div>
</div>

<div id="timeOverlay">
  <div id="clock">
    <div class="hand hour"></div>
    <div class="hand minute"></div>
    <div class="hand second"></div>
    <div class="center-dot"></div>
  </div>
  <div id="dateText"></div>
</div>

<div id="flashWhite"></div>
<div id="flashBlue"></div>

<div id="notFound">
  <h1>404</h1>
  <p>Page not found</p>
</div>

<div id="aiOverride">
  <div id="aiBox">
    <p id="aiOverrideText"></p>
    <button id="magicBtn">MAGIC 🪄</button>
  </div>
</div>

<div id="magicOverlay"></div>
  <div id="retroPage"></div>

<audio id="clockSound" src="audio/clock.mp3" preload="auto"></audio>
  <audio id="typeSound" src="audio/type.mp3" preload="auto"></audio>

<script>
  const typeSound = document.getElementById("typeSound");
typeSound.volume = 0.3; // softer sound
  function playTypeSound(){
  typeSound.pause();
  typeSound.currentTime = 0;
  typeSound.play().catch(()=>{});
  }
  function typeTitle(text, year){
  const title = document.getElementById("retroTitle");
  title.innerHTML = "";
  title.style.opacity = 1;

  // timeline colors
  if(year < 1900) title.style.color = "#cfa66a";      // sepia
  else if(year < 2000) title.style.color = "#00ff88"; // CRT green
  else if(year < 3000) title.style.color = "#00f2ff"; // neon
  else title.style.color = "#b36bff";                 // cosmic

  let i = 0;
  const interval = setInterval(()=>{
  title.innerHTML += text[i];
  playTypeSound(); // 🔊 typing sound
  i++;

  if(i >= text.length){
    clearInterval(interval);
    typeSound.pause();       // 🛑 stop sound
    typeSound.currentTime = 0;
  }
}, 90);
  }
const video=document.getElementById("sceneVideo");
const cockpit=document.getElementById("cockpit");
const cockpitImg=document.getElementById("cockpitImg");
const aiText=document.getElementById("aiText");
const controls=document.getElementById("controls");

const timeOverlay=document.getElementById("timeOverlay");
const hourHand=document.querySelector(".hour");
const minuteHand=document.querySelector(".minute");
const secondHand=document.querySelector(".second");
const dateText=document.getElementById("dateText");

const flashWhite=document.getElementById("flashWhite");
const flashBlue=document.getElementById("flashBlue");
const notFound=document.getElementById("notFound");

const aiOverride=document.getElementById("aiOverride");
const aiOverrideText=document.getElementById("aiOverrideText");
const magicOverlay=document.getElementById("magicOverlay");
const magicBtn=document.getElementById("magicBtn");

const clockSound=document.getElementById("clockSound");
clockSound.loop=true;

let chosenPath,chosenYear;
let angle=0,clockInterval;
let year=2026,dir=1;

/* CLOCK NUMBERS */
const clock=document.getElementById("clock");
for(let i=1;i<=12;i++){
  const n=document.createElement("div");
  n.className="number";n.innerText=i;
  const r=100,a=(i-3)*30*Math.PI/180;
  n.style.left=120+r*Math.cos(a)+"px";
  n.style.top=120+r*Math.sin(a)+"px";
  clock.appendChild(n);
}

function selectPath(p){
  chosenPath=p;
  pathBtns.style.display="none";
  yearBtns.style.display="block";
  pastYears.style.display=p==="past"?"block":"none";
  futureYears.style.display=p==="future"?"block":"none";
  aiText.innerText="Select destination year.";
}
function selectYear(y){
  chosenYear=y;
  goBtn.style.display="block";
  yearBtns.style.display="none";
  aiText.innerText="Destination locked.";
}
function goBack(){
  goBtn.style.display="none";
  yearBtns.style.display="block";
}

function playVideo(src){
  video.src=src;
  video.muted=false;
  video.play().catch(()=>{});
}

/* FLIGHT FLOW */
function takeOff(){
  controls.style.display="none";
  cockpit.style.display="none";
  aiText.innerText="Engines online. Launching.";

  playVideo("videos/launch.mp4");

  video.onended=()=>{
    aiText.innerText="Leaving Earth orbit.";
    playVideo("videos/fly.mp4");

    video.onended=()=>{
      cockpit.style.display="block";
      cockpitImg.src="images/cockpit_overlay.png";

      if(chosenPath==="future"){
        aiText.innerText="Approaching black hole.";
        playVideo("videos/blackhole.mp4");
      }else{
        aiText.innerText="Entering wormhole.";
        playVideo("videos/wormhole.mp4");
      }

      dir=chosenPath==="future"?1:-1;
      year=2026;
      setTimeout(startClock,5000);
    }
  }
}

function startClock(){
  timeOverlay.style.opacity="1";
  clockSound.play().catch(()=>{});
  aiText.innerText="Temporal distortion detected.";

  const totalYears=Math.abs(chosenYear-year);
  const step=Math.max(1,Math.ceil(totalYears/200));

  clockInterval=setInterval(()=>{
    angle+=dir*70;
    secondHand.style.transform=`rotate(${angle}deg)`;
    minuteHand.style.transform=`rotate(${angle/10}deg)`;
    hourHand.style.transform=`rotate(${angle/120}deg)`;

    year+=dir*step;
    if((dir===1&&year>=chosenYear)||(dir===-1&&year<=chosenYear)){
      year=chosenYear;
      dateText.innerText=`01/01/${year}`;
      stopClock();
      return;
    }
    dateText.innerText=`01/01/${year}`;
  },40);
}

function stopClock(){
  clearInterval(clockInterval);
  clockSound.pause();
  aiText.innerText="Timeline reached.";
  timeOverlay.style.display="none";

  flashWhite.style.opacity="1";
  setTimeout(()=>{
    flashWhite.style.opacity="0";
    playArrival();
  },2000);
}

function playArrival(){
  cockpit.style.display="none";
  aiText.innerText="Arriving in destination timeline.";
  playVideo("videos/arrival.mp4");

  video.onended=()=>{
    if(chosenPath==="past"){
      flashBlue.style.opacity="1";
      setTimeout(()=>{
        flashBlue.style.opacity="0";
        notFound.style.display="flex";

        setTimeout(()=>{
          notFound.style.display="none";
          showAiOverride();
        },2000);

      },800);
    }
  }
}

function showAiOverride(){
  aiOverride.style.display="flex";
  aiOverrideText.innerText=
`This is the year ${chosenYear}.
The internet does not exist in this timeline.
That page cannot exist here.
But I can try something else.`;
}

/* MAGIC ACTION */
  function fadeInRetroClock(){
  const clockWrap = document.getElementById("retroClockWrap");
  clockWrap.style.opacity = "1";
  }
magicBtn.onclick = () => {

  // 1️⃣ Magic colors
  magicOverlay.classList.add("active");

  setTimeout(()=>{
    magicOverlay.style.background =
      "linear-gradient(135deg,#6a00ff,#00f2ff,#ffd700)";
  },300);

  // 2️⃣ Hard cut to void (black screen)
  setTimeout(()=>{
    magicOverlay.classList.remove("active");
    aiOverride.style.display = "none";

    document.body.style.background = "black";
  },1400);

  // 3️⃣ Show retro page
  setTimeout(()=>{
    const retro = document.getElementById("retroPage");
    retro.style.display = "flex";
    typeTitle(`WELCOME TO ${chosenYear}`, chosenYear);
    

setTimeout(()=>{
  fadeInRetroClock();
}, 1200);
  },2400);

};
  function showRetroClock(){
  const clock = document.getElementById("clock");

  // reset + show clock
  clock.style.opacity = 0;
  clock.style.transition = "opacity 2s ease";
  clock.style.display = "block";

  setTimeout(()=>{
    clock.style.opacity = 1;
    startRetroClock();
  }, 500);
}

function startRetroClock(){
  let sec = 0;
  setInterval(()=>{
    sec += 6;
    secondHand.style.transform = `rotate(${sec}deg)`;
    minuteHand.style.transform = `rotate(${sec/60}deg)`;
    hourHand.style.transform = `rotate(${sec/720}deg)`;
  }, 1000);
}
  function startRetroClock(){
  const rc = document.getElementById("retroClock");
  rc.classList.add("active");

  let h = 10, m = 0, s = 0;

  setInterval(()=>{
    s++;
    if(s===60){s=0;m++}
    if(m===60){m=0;h++}
    if(h===24)h=0;

    rc.innerText =
      `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
  },1000);
  }
</script>
<div id="retroTitleWrap">
  <div id="retroTitle"></div>
</div>
  <div id="retroClockWrap">
  <div id="retroClockFace">
    <div class="retroHand retroHour"></div>
    <div class="retroHand retroMinute"></div>
    <div class="retroHand retroSecond"></div>
    <div class="retroCenter"></div>
  </div>
  </div>
</body>
</html>
