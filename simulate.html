<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Time Simulation</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: black;
      overflow: hidden;
      font-family: Arial, sans-serif;
      color: white;
    }

    /* ROTATE GATE */
    #rotate {
      position: fixed;
      inset: 0;
      background: black;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      z-index: 9999;
    }

    /* VIDEO LAYER */
    #videoStage {
      position: fixed;
      inset: 0;
      z-index: 1;
    }

    video {
      width: 100vw;
      height: 100vh;
      object-fit: cover;
    }

    /* COCKPIT OVERLAY */
    #cockpit {
      position: fixed;
      inset: 0;
      z-index: 3;
      pointer-events: none;
    }

    #cockpit img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* AI CONSOLE */
    #ai {
      position: fixed;
      bottom: 20px;
      left: 20px;
      max-width: 60%;
      font-size: 14px;
      opacity: 0.85;
      z-index: 4;
    }

    /* CONTROLS */
    #controls {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 4;
    }

    button {
      background: transparent;
      border: 1px solid white;
      color: white;
      padding: 10px 16px;
      margin-left: 10px;
      cursor: pointer;
    }

    /* LANDSCAPE ONLY */
    @media (orientation: landscape) {
      #rotate {
        display: none;
      }
    }
  </style>
</head>

<body>

  <!-- ROTATE SCREEN -->
  <div id="rotate">
    <h2>Rotate your device to begin</h2>
  </div>

  <!-- VIDEO STAGE -->
  <div id="videoStage">
    <video id="sceneVideo" playsinline muted></video>
  </div>

  <!-- COCKPIT -->
  <div id="cockpit">
    <img id="cockpitImg" src="images/cockpit_ground.png" />
  </div>

  <!-- AI TEXT -->
  <div id="ai">
    <p id="aiText">System online. Location: Earth.</p>
  </div>

  <!-- CONTROLS -->
  <div id="controls">
    <div id="pathBtns">
      <button onclick="selectPath('past')">PAST</button>
      <button onclick="selectPath('future')">FUTURE</button>
    </div>

    <div id="yearBtns" style="display:none;">
      <div id="pastYears" style="display:none;">
        <button onclick="selectYear(1897)">1897</button>
        <button onclick="selectYear(1987)">1987</button>
      </div>

      <div id="futureYears" style="display:none;">
        <button onclick="selectYear(2050)">2050</button>
        <button onclick="selectYear(3079)">3079</button>
      </div>
    </div>

    <div id="goBtn" style="display:none;">
      <button onclick="takeOff()">TAKE OFF 🚀</button>
    </div>
  </div>

  <script>
    const video = document.getElementById("sceneVideo");
    const cockpit = document.getElementById("cockpitImg");
    const aiText = document.getElementById("aiText");

    let chosenPath = null;
    let chosenYear = null;

    function selectPath(type) {
      chosenPath = type;

      document.getElementById("pathBtns").style.display = "none";
      document.getElementById("yearBtns").style.display = "block";

      document.getElementById("pastYears").style.display =
        type === "past" ? "block" : "none";

      document.getElementById("futureYears").style.display =
        type === "future" ? "block" : "none";

      aiText.innerText =
        type === "future"
          ? "Future selected. Choose a destination year."
          : "Past selected. Choose a destination year.";
    }

    function selectYear(year) {
      chosenYear = year;
      document.getElementById("yearBtns").style.display = "none";
      document.getElementById("goBtn").style.display = "block";
      aiText.innerText = "Destination locked: " + year;
    }

    function takeOff() {
      video.src = "videos/launch.mp4";
      video.muted = true;
      video.play().catch(() => {});

      cockpit.src = "images/cockpit_overlay.png";
      aiText.innerText = "Engines online. Leaving Earth.";

      video.onended = () => {
        if (chosenPath === "future") {
          video.src = "videos/blackhole.mp4";
          video.muted = true;
          video.play().catch(() => {});
          aiText.innerText = "Approaching black hole.";
        } else {
          video.src = "videos/wormhole.mp4";
          video.muted = true;
          video.play().catch(() => {});
          aiText.innerText = "Entering wormhole.";
        }
      };
    }
  </script>

</body>
</html>
