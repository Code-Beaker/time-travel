<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Time Simulation</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:black;overflow:hidden;font-family:Arial;color:white}

/* VIDEO */
#videoStage{position:fixed;inset:0;z-index:1}
video{width:100vw;height:100vh;object-fit:cover}

/* COCKPIT */
#cockpit{position:fixed;inset:0;z-index:3;pointer-events:none}
#cockpit img{width:100%;height:100%;object-fit:cover}

/* AI */
#ai{position:fixed;bottom:20px;left:20px;z-index:4;max-width:65%;font-size:14px}

/* CONTROLS */
#controls{position:fixed;bottom:20px;right:20px;z-index:4}
button{
  background:rgba(0,242,255,.25);
  border:1px solid #00f2ff;
  color:#00f2ff;
  padding:12px 18px;
  font-weight:bold;
  cursor:pointer;
}
button:hover{background:#00f2ff;color:black}

/* TIME OVERLAY */
#timeOverlay{
  position:fixed;inset:0;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  background:rgba(0,0,0,.45);
  opacity:0;transition:opacity 1.5s ease;
  z-index:5;pointer-events:none;
}

/* CLOCK */
#clock{width:240px;height:240px;border:2px solid white;border-radius:50%;position:relative}
.number{position:absolute;transform:translate(-50%,-50%);font-size:14px}
.hand{position:absolute;top:50%;left:50%;transform-origin:0% 50%;transform:translateY(-50%);background:white}
.hour{width:35%;height:4px}
.minute{width:50%;height:3px}
.second{width:50%;height:2px;background:red}
.center-dot{width:8px;height:8px;background:white;border-radius:50%;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)}
#dateText{margin-top:20px;font-size:24px}

/* FLASH */
#flashWhite,#flashBlue{position:fixed;inset:0;opacity:0;z-index:10;transition:.4s}
#flashWhite{background:white}
#flashBlue{background:#0b1c2d}

/* 404 */
#notFound{
  position:fixed;inset:0;
  background:#111;color:#d0d0d0;
  display:none;align-items:center;justify-content:center;
  flex-direction:column;z-index:20;
}

/* AI OVERRIDE */
#aiOverride{
  position:fixed;inset:0;
  background:radial-gradient(circle,#111,#000);
  display:none;align-items:center;justify-content:center;
  z-index:30;
}
#aiBox{max-width:420px}
#magicBtn{
  margin-top:20px;
  background:linear-gradient(135deg,#6a00ff,#00f2ff);
  border:none;padding:12px 22px;font-weight:bold;cursor:pointer;
}

/* MAGIC */
#magicOverlay{
  position:fixed;inset:0;
  background:radial-gradient(circle,#6a00ff,#00f2ff,#000);
  opacity:0;pointer-events:none;z-index:40;
  transition:.5s;
}
#magicOverlay.active{opacity:1}

/* RETRO */
#retroSite{
  position:fixed;inset:0;
  display:none;padding:40px;
  background:black;z-index:50;
}
</style>
</head>

<body>

<div id="videoStage"><video id="sceneVideo" playsinline preload="auto"></video></div>
<div id="cockpit"><img id="cockpitImg" src="images/cockpit_ground.png"></div>
<div id="ai"><p id="aiText">System online.</p></div>

<div id="controls">
  <div id="pathBtns">
    <button onclick="selectPath('past')">PAST</button>
    <button onclick="selectPath('future')">FUTURE</button>
  </div>
  <div id="yearBtns" style="display:none">
    <div id="pastYears">
      <button onclick="selectYear(1897)">1897</button>
      <button onclick="selectYear(1987)">1987</button>
    </div>
    <div id="futureYears" style="display:none">
      <button onclick="selectYear(2050)">2050</button>
      <button onclick="selectYear(3079)">3079</button>
    </div>
  </div>
  <div id="goBtn" style="display:none">
    <button onclick="goBack()">← BACK</button>
    <button onclick="takeOff()">TAKE OFF 🚀</button>
  </div>
</div>

<div id="timeOverlay">
  <div id="clock">
    <div class="hand hour"></div>
    <div class="hand minute"></div>
    <div class="hand second"></div>
    <div class="center-dot"></div>
  </div>
  <div id="dateText"></div>
</div>

<div id="flashWhite"></div>
<div id="flashBlue"></div>

<div id="notFound">
  <h1>404</h1>
  <p>Page not found</p>
</div>

<div id="aiOverride">
  <div id="aiBox">
    <p id="aiOverrideText"></p>
    <button id="magicBtn">MAGIC 🪄</button>
  </div>
</div>

<div id="magicOverlay"></div>

<div id="retroSite">
  <h1 id="retroTitle"></h1>
  <p id="retroText"></p>
</div>

<audio id="clockSound" src="audio/clock.mp3"></audio>

<script>
const video=document.getElementById("sceneVideo");
const pathBtns=document.getElementById("pathBtns");
const yearBtns=document.getElementById("yearBtns");
const pastYears=document.getElementById("pastYears");
const futureYears=document.getElementById("futureYears");
const goBtn=document.getElementById("goBtn");
const ai=document.getElementById("ai");
const aiText=document.getElementById("aiText");
const controls=document.getElementById("controls");
const cockpit=document.getElementById("cockpit");
const cockpitImg=document.getElementById("cockpitImg");
const timeOverlay=document.getElementById("timeOverlay");
const hourHand=document.querySelector(".hour");
const minuteHand=document.querySelector(".minute");
const secondHand=document.querySelector(".second");
const dateText=document.getElementById("dateText");
const flashWhite=document.getElementById("flashWhite");
const flashBlue=document.getElementById("flashBlue");
const notFound=document.getElementById("notFound");
const aiOverride=document.getElementById("aiOverride");
const aiOverrideText=document.getElementById("aiOverrideText");
const magicOverlay=document.getElementById("magicOverlay");
const magicBtn=document.getElementById("magicBtn");
const retro=document.getElementById("retroSite");
const retroTitle=document.getElementById("retroTitle");
const retroText=document.getElementById("retroText");
const clockSound=document.getElementById("clockSound");

let chosenPath,chosenYear,angle=0,year=2026,dir=1,clockInterval;

function selectPath(p){
  chosenPath=p;
  pathBtns.style.display="none";
  yearBtns.style.display="block";
  pastYears.style.display=p==="past"?"block":"none";
  futureYears.style.display=p==="future"?"block":"none";
}

function selectYear(y){
  chosenYear=y;
  yearBtns.style.display="none";
  goBtn.style.display="block";
}

function goBack(){
  goBtn.style.display="none";
  yearBtns.style.display="block";
}

function playVideo(src){
  video.src=src;
  video.play().catch(()=>{});
}

function takeOff(){
  dir = chosenPath==="future" ? 1 : -1;
  controls.style.display="none";
  cockpit.style.display="none";
  playVideo("videos/launch.mp4");
  video.onended=()=>{
    playVideo("videos/fly.mp4");
    video.onended=()=>{
      cockpit.style.display="block";
      cockpitImg.src="images/cockpit_overlay.png";
      playVideo(chosenPath==="future"?"videos/blackhole.mp4":"videos/wormhole.mp4");
      setTimeout(startClock,5000);
    };
  };
}

function startClock(){
  timeOverlay.style.opacity="1";
  clockSound.play();
  clockInterval=setInterval(()=>{
    angle+=dir*80;
    secondHand.style.transform=`rotate(${angle}deg)`;
    minuteHand.style.transform=`rotate(${angle/10}deg)`;
    hourHand.style.transform=`rotate(${angle/120}deg)`;
    year+=dir*2;
    dateText.innerText=`01/01/${year}`;
    if((dir===1&&year>=chosenYear)||(dir===-1&&year<=chosenYear)){
      year=chosenYear;
      stopClock();
    }
  },40);
}

function stopClock(){
  clearInterval(clockInterval);
  clockSound.pause();
  timeOverlay.style.display="none";
  flashWhite.style.opacity="1";
  setTimeout(()=>{flashWhite.style.opacity="0";playArrival();},1500);
}

function playArrival(){
  cockpit.style.display="none";
  playVideo("videos/arrival.mp4");
  video.onended=()=>{
    if(chosenPath==="past"){
      flashBlue.style.opacity="1";
      setTimeout(()=>{
        flashBlue.style.opacity="0";
        notFound.style.display="flex";
        setTimeout(showAiOverride,2000);
      },800);
    }
  };
}

function showAiOverride(){
  video.pause();video.src="";
  ai.style.display="none";
  aiOverride.style.display="flex";
  aiOverrideText.innerText=
`This is the year ${chosenYear}.
The internet does not exist here.
But I can try something else.`;
}

magicBtn.onclick=()=>{
  magicOverlay.classList.add("active");
  setTimeout(()=>{
    magicOverlay.classList.remove("active");
    aiOverride.style.display="none";
    retro.style.display="block";
    retroTitle.innerText=`WELCOME TO ${chosenYear}`;
    retroText.innerText="Timeline stabilized.";
  },1400);
};
</script>

</body>
</html>
