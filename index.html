<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Time Travel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Fonts (sci-fi vibes) -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=JetBrains+Mono&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- HERO SECTION -->
  <section class="hero">
    <h1 class="title">TIME TRAVEL</h1>

    <p class="timeline">
      <span class="past">Past</span> •
      <span class="present">Present</span> •
      <span class="future">Future</span>
    </p>

    <p class="quote">Everything is connected 🧩⏳</p>
  </section>

  <!-- LINEAR TIME -->
  <section class="section">
    <h2>Linear Time</h2>
    <p>
      Time moves forward. One second replaces another.
      There is no rewind.
    </p>

    <div id="clock">00:00:00</div>
  </section>

  <!-- WORMHOLES -->
  <section class="section">
    <h2>Wormholes</h2>
    <p>
      Shortcuts through spacetime.
      Fast. Unstable. Dangerous.
    </p>

    <img src="images/wormhole.jpg" alt="Wormhole">
  </section>

  <!-- PARADOX -->
  <section class="section">
    <h2>Paradox</h2>
    <p>
      Change the past,
      and reality pushes back.
    </p>

    <img src="images/paradox.jpg" alt="Paradox">
  </section>

  <!-- CALL TO ACTION -->
  <section class="cta">
    <a href="travel.html" class="btn">TIME TRAVEL 🚀</a>
  </section>

  <!-- JAVASCRIPT -->
  <script src="script.js"></script>
</body>
</html>
