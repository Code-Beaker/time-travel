<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Night Sky</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:black;
  overflow:hidden;
  font-family: Arial, sans-serif;
  color:white;
}

/* VIDEO */
video{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
}

/* DESCRIPTION TEXT */
#skyText{
  position:fixed;
  bottom:30px;
  left:30px;
  max-width:420px;
  font-size:15px;
  line-height:1.5;
  opacity:0;
  transition:opacity 2s ease;
}

/* BUTTON */
#backBtn{
  position:fixed;
  bottom:30px;
  right:30px;
  padding:14px 28px;
  font-size:16px;
  border:2px solid white;
  background:transparent;
  color:white;
  border-radius:30px;
  cursor:pointer;
  opacity:0;
  transition:opacity 2s ease, box-shadow 0.3s ease;
}

#backBtn:hover{
  box-shadow:0 0 20px rgba(255,255,255,0.6);
}
</style>
</head>

<body>

<video id="skyVideo" autoplay muted playsinline></video>

<div id="skyText"></div>

<button id="backBtn">Let’s go back to 2026</button>

<script>
const params = new URLSearchParams(window.location.search);
const year = params.get("year") || "1897";

const video = document.getElementById("skyVideo");
const text = document.getElementById("skyText");
const btn = document.getElementById("backBtn");

// VIDEO SOURCE + TEXT
if(year === "1897"){
  video.src = "videos/sky1897.mp4";
  text.innerText =
    "In 1897, light pollution is almost nonexistent.\n" +
    "The night sky is dense, alive, and overflowing with stars.\n" +
    "What you see above is the sky in its purest form.";
}
else if(year === "1987"){
  video.src = "videos/sky1987.mp4";
  text.innerText =
    "By 1987, artificial lights have begun to affect the night.\n" +
    "Stars are still visible, but the darkness is slowly fading.";
}
else if(year === "2050"){
  video.src = "videos/sky2050.mp4";
  text.innerText =
    "In 2050, light pollution dominates most cities.\n" +
    "This sky is visible only from rare low-pollution regions.\n" +
    "Many stars are already lost to human glow.";
}
else if(year === "3079"){
  video.src = "videos/sky3079.mp4";
  text.innerText =
    "By 3079, artificial illumination overwhelms the planet.\n" +
    "The stars still exist — but human eyes can no longer see them.";
}

// TEXT FADE IN
setTimeout(()=>{
  text.style.opacity = 1;
},500);

// TEXT FADE OUT AFTER 6s
setTimeout(()=>{
  text.style.opacity = 0;
},6500);

// BUTTON APPEAR AFTER 3s
setTimeout(()=>{
  btn.style.opacity = 1;
},3000);

// FREEZE VIDEO AT END
video.addEventListener("ended",()=>{
  video.pause();
});

// BUTTON ACTION
btn.onclick = ()=>{
  window.location.href = "time.html?year=2026";
};
</script>

</body>
</html>
