<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Time Consequence</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  /* --- FIX 1: REMOVE ANDROID HIGHLIGHT GLOBALLY --- */
  * { 
    -webkit-tap-highlight-color: transparent; 
  }

  /* --- MANDATORY FIX 2: POINTER EVENTS LOCKDOWN --- */
  body {
    margin: 0;
    padding: 0;
    background-color: #000;
    color: #fff;
    font-family: 'Courier New', Courier, monospace;
    overflow-y: auto;
    overflow-x: hidden; 
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    user-select: none;
    /* GLOBAL LOCK */
    pointer-events: none;
  }

  /* --- MANDATORY FIX 2 & 3: CONTAINER SAFETY --- */
  #stage,
  #narrativeBox,
  #timeDialogue,
  #clockContainer,
  #userActions {
    pointer-events: none;
  }
  
  #userActions:empty {
    pointer-events: none;
  }

  /* --- FONTS & TYPOGRAPHY --- */
  .font-past {
    font-family: 'Georgia', 'Times New Roman', serif;
    letter-spacing: 1px;
  }
  .font-future {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  /* --- CONTAINERS --- */
  #stage {
    text-align: center;
    width: 90%;
    max-width: 800px;
    position: relative;
    z-index: 10;
    padding: 50px 0;
  }

  /* --- TEXT FADES --- */
  .fade-line {
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 1.5s ease, transform 1.5s ease;
    margin-bottom: 20px;
    font-size: 24px;
    line-height: 1.5;
    text-shadow: 0 0 10px rgba(255,255,255,0.3);
  }
  .fade-line.visible {
    opacity: 1;
    transform: translateY(0);
  }
  .fade-line.big-bold {
    font-size: 48px;
    font-weight: 900;
    letter-spacing: 5px;
    color: #ddd;
  }

  /* --- BUTTONS --- */
  /* MANDATORY FIX 2: RE-ENABLE BUTTONS */
  button, .cinematic-btn, .final-btn {
    pointer-events: auto;
  }

  .cinematic-btn {
    background: transparent;
    border: 1px solid rgba(255,255,255,0.4);
    color: rgba(255,255,255,0.8);
    padding: 15px 30px;
    font-size: 18px;
    margin-top: 40px;
    cursor: pointer;
    opacity: 0;
    transition: all 0.8s ease;
    font-family: inherit;
    letter-spacing: 2px;
  }
  .cinematic-btn:hover {
    border-color: #fff;
    color: #fff;
    box-shadow: 0 0 15px rgba(255,255,255,0.5);
  }
  .cinematic-btn.visible {
    opacity: 1;
  }
  
  .sent-anim {
    animation: slideUpFade 1s forwards;
    pointer-events: none;
  }
  @keyframes slideUpFade {
    0% { opacity: 1; transform: translateY(0); }
    100% { opacity: 0; transform: translateY(-30px); }
  }

  /* --- THE CLOCK --- */
  #clockContainer {
    display: none; 
    flex-direction: column;
    align-items: center;
    margin-bottom: 30px;
    transition: opacity 3s ease; 
    opacity: 0;
  }
  #clockBody {
    width: 200px;
    height: 200px;
    border-radius: 50%;
    background: radial-gradient(circle, #2a2a2a, #000);
    border: 4px solid #ff0000;
    box-shadow: 0 0 20px rgba(255, 0, 0, 0.6);
    position: relative;
    transition: border-color 3s ease, box-shadow 3s ease;
  }

  /* SHAKE ANIMATION */
  @keyframes shake {
    0% { transform: translate(1px, 1px) rotate(0deg); }
    10% { transform: translate(-1px, -2px) rotate(-1deg); }
    20% { transform: translate(-3px, 0px) rotate(1deg); }
    30% { transform: translate(3px, 2px) rotate(0deg); }
    40% { transform: translate(1px, -1px) rotate(1deg); }
    50% { transform: translate(-1px, 2px) rotate(-1deg); }
    60% { transform: translate(-3px, 1px) rotate(0deg); }
    70% { transform: translate(3px, 1px) rotate(-1deg); }
    80% { transform: translate(-1px, -1px) rotate(1deg); }
    90% { transform: translate(1px, 2px) rotate(0deg); }
    100% { transform: translate(1px, -2px) rotate(-1deg); }
  }
  .shake {
    animation: shake 0.5s infinite;
  }
  
  /* Clock Hands */
  .hand {
    position: absolute;
    bottom: 50%;
    left: 50%;
    background: #fff;
    transform-origin: bottom center;
    border-radius: 2px;
    opacity: 0.8;
  }
  .hour-hand {
    width: 4px;
    height: 50px;
    transform: translateX(-50%) rotate(45deg);
  }
  .minute-hand {
    width: 2px;
    height: 70px;
    transform: translateX(-50%) rotate(180deg);
  }
  .center-dot {
    position: absolute;
    top: 50%; left: 50%;
    width: 10px; height: 10px;
    background: #fff;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 5px #fff;
  }

  /* Clock Colors */
  #clockBody.purple {
    border-color: #a020f0;
    box-shadow: 0 0 30px rgba(160, 32, 240, 0.7);
  }
  #clockBody.blue {
    border-color: #00f2ff;
    box-shadow: 0 0 40px rgba(0, 242, 255, 0.8);
  }

  /* Clock Spin Animations */
  .spin-cw {
    animation: spinClock 0.2s linear infinite;
  }
  .spin-ccw {
    animation: spinClockCCW 0.2s linear infinite;
  }

  @keyframes spinClock {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
  @keyframes spinClockCCW {
    0% { transform: rotate(360deg); }
    100% { transform: rotate(0deg); }
  }

  /* Dialogue Box */
  #timeDialogue {
    min-height: 120px;
    margin-top: 20px;
  }
  .speaker-label {
    font-size: 14px;
    color: #666;
    margin-bottom: 10px;
    opacity: 0;
    transition: opacity 1s;
  }

  /* Thinking Dots */
  .thinking {
    font-size: 30px;
    letter-spacing: 5px;
    animation: pulse 1.5s infinite;
    color: #888;
  }
  @keyframes pulse {
    0% { opacity: 0.3; }
    50% { opacity: 1; }
    100% { opacity: 0.3; }
  }

  /* --- FULL SCREEN FX --- */
  #flashOverlay {
    position: fixed;
    inset: 0;
    background: white;
    opacity: 0;
    pointer-events: none;
    z-index: 100;
    transition: opacity 4s ease;
  }
  #blackout {
    position: fixed;
    inset: 0;
    background: black;
    z-index: 99;
    opacity: 0;
    pointer-events: none;
    transition: opacity 2s ease;
  }
  
  /* Cockpit Background */
  #cockpitBg {
    position: fixed;
    inset: 0;
    background-image: url('images/cockpit_ground.png');
    background-size: cover;
    background-position: center;
    opacity: 0;
    z-index: 1;
    transition: opacity 3s ease;
    pointer-events: none;
  }
  
  /* Final Button Container */
  #finalBtnContainer {
    position: fixed;
    bottom: 50px;
    width: 100%;
    text-align: center;
    z-index: 20;
    opacity: 0;
    transition: opacity 3s ease;
    pointer-events: none;
  }
  .final-btn {
    background: transparent;
    border: 1px solid rgba(0, 242, 255, 0.3);
    color: #00f2ff;
    padding: 15px 40px;
    font-size: 18px;
    cursor: pointer;
    font-family: inherit;
    letter-spacing: 2px;
    text-shadow: 0 0 10px rgba(0, 242, 255, 0.5);
    box-shadow: 0 0 10px rgba(0, 242, 255, 0.1);
    transition: all 1s ease;
  }
  .final-btn:hover {
    box-shadow: 0 0 20px rgba(0, 242, 255, 0.3);
    background: rgba(0, 242, 255, 0.05);
  }

</style>
</head>
<body>

  <div id="flashOverlay"></div>
  <div id="blackout"></div>
  <div id="cockpitBg"></div>

  <div id="stage">
    
    <div id="narrativeBox"></div>

    <div id="clockContainer">
      <div id="clockBody">
        <div class="hand hour-hand"></div>
        <div class="hand minute-hand"></div>
        <div class="center-dot"></div>
      </div>
      <div id="timeDialogue"></div>
    </div>

    <div id="userActions"></div>

  </div>

  <div id="finalBtnContainer">
    <button class="final-btn" onclick="event.stopPropagation(); window.location.href='end.html'">WELCOME BACK TO 2026</button>
  </div>

  <audio id="travelAudio" src="audio/travel.mp3" preload="auto"></audio>

  <script>
    // --- MANDATORY FIX 1 & 5: DISABLE GESTURES & BACK NAV ---
    history.pushState(null, "", location.href);
    window.addEventListener("popstate", () => {
      history.pushState(null, "", location.href);
    });

    window.addEventListener("touchstart", e => {
      if (!e.target.closest("button")) {
        e.preventDefault();
      }
    }, { passive: false });

    window.addEventListener("touchend", e => {
      if (!e.target.closest("button")) {
        e.preventDefault();
      }
    }, { passive: false });

    window.addEventListener("click", e => {
      if (!e.target.closest("button")) {
        e.preventDefault();
        e.stopPropagation();
      }
    }, true);


    // --- SETUP & PARAMS ---
    const urlParams = new URLSearchParams(window.location.search);
    const yearParam = urlParams.get('year');
    const year = yearParam ? parseInt(yearParam) : 1897;
    const isFuture = year > 2026;

    // --- SAFETY LOCK VARIABLE ---
    let interactionEnabled = false;

    // --- DOM ELEMENTS ---
    const body = document.body;
    const stage = document.getElementById('stage');
    const narrativeBox = document.getElementById('narrativeBox');
    const clockContainer = document.getElementById('clockContainer');
    const clockBody = document.getElementById('clockBody');
    const timeDialogue = document.getElementById('timeDialogue');
    const userActions = document.getElementById('userActions');
    const flashOverlay = document.getElementById('flashOverlay');
    const blackout = document.getElementById('blackout');
    const cockpitBg = document.getElementById('cockpitBg');
    const finalBtnContainer = document.getElementById('finalBtnContainer');
    const travelAudio = document.getElementById('travelAudio');

    // Apply Cinematic Fonts
    if (isFuture) {
      body.classList.add('font-future');
    } else {
      body.classList.add('font-past');
    }

    // --- AUDIO SYSTEM ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    let tickInterval;
    let currentTickType = 'hostile';

    function playTick() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      
      const osc = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();
      
      osc.connect(gainNode);
      gainNode.connect(audioCtx.destination);
      
      if (currentTickType === 'hostile') {
        osc.type = 'square'; 
        osc.frequency.setValueAtTime(800, audioCtx.currentTime); 
        osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.05);
        gainNode.gain.setValueAtTime(0.08, audioCtx.currentTime); 
        gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
      } else {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(300, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.1);
        gainNode.gain.setValueAtTime(0.05, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
      }
      
      osc.start();
      osc.stop(audioCtx.currentTime + 0.2);
    }

    function startTicking(speed = 1000) {
      stopTicking();
      playTick();
      tickInterval = setInterval(playTick, speed);
    }
    
    function stopTicking() {
      if (tickInterval) clearInterval(tickInterval);
    }

    // --- HELPER FUNCTIONS ---

    function flashScreen(color = 'white') {
      flashOverlay.style.background = color;
      flashOverlay.style.opacity = 1;
      setTimeout(() => { flashOverlay.style.opacity = 0; }, 200);
    }

    function clearNarrative() {
      narrativeBox.innerHTML = '';
      timeDialogue.innerHTML = '';
      userActions.innerHTML = '';
      userActions.style.pointerEvents = "none";
    }

    function addTextLine(text, container, delay = 0, isBold = false) {
      setTimeout(() => {
        const p = document.createElement('div');
        p.className = 'fade-line' + (isBold ? ' big-bold' : '');
        p.innerHTML = text; 
        container.appendChild(p);
        void p.offsetWidth; 
        p.classList.add('visible');
      }, delay);
    }

    function showButton(text, onClickDelay, callback) {
      setTimeout(() => {
        userActions.style.pointerEvents = "auto";

        const btn = document.createElement('button');
        btn.className = 'cinematic-btn';
        btn.innerText = text;
        
        interactionEnabled = true;

        // MANDATORY FIX 4: BUTTONS MUST STOP PROPAGATION
        btn.onclick = (e) => {
          e.preventDefault();
          e.stopPropagation();

          if (!interactionEnabled) return;
          interactionEnabled = false;

          btn.classList.remove('visible');
          btn.classList.add('sent-anim');
          setTimeout(() => {
            btn.remove();
            userActions.style.pointerEvents = "none";
            if(callback) callback();
          }, 1000);
        };
        userActions.appendChild(btn);
        void btn.offsetWidth;
        btn.classList.add('visible');
      }, onClickDelay);
    }

    function showSpeakerLabel() {
      const label = document.createElement('div');
      label.className = 'speaker-label';
      label.innerText = 'ENTITY: TIME';
      timeDialogue.appendChild(label);
      setTimeout(() => label.style.opacity = 1, 100);
    }

    function clockSpeak(linesArray, nextAction, isAuto = false) {
      const oldLines = timeDialogue.querySelectorAll('.fade-line');
      oldLines.forEach(l => l.remove());
      
      const dots = document.createElement('div');
      dots.className = 'thinking';
      dots.innerText = '•••';
      timeDialogue.appendChild(dots);

      setTimeout(() => {
        dots.remove();
        if(!timeDialogue.querySelector('.speaker-label')) showSpeakerLabel();

        let totalDelay = 0;
        linesArray.forEach((line, index) => {
          addTextLine(line, timeDialogue, index * 2000); 
          totalDelay = (index * 2000);
        });

        const buffer = isAuto ? 4000 : 300; 
        
        if(nextAction) setTimeout(nextAction, totalDelay + 1500 + buffer);

      }, 2000); 
    }

    // --- STORY PHASES ---

    // PHASE 0: THE JOKE
    function startPhase0() {
      let lines = [];
      if (isFuture) {
        lines = [
          "Return?",
          "Nice joke.",
          "You burned most of your fuel escaping a black hole’s gravity.",
          "One wrong move and you’d be spaghettified.",
          "That monster is far beyond reach now."
        ];
      } else {
        lines = [
          "Return?",
          "Nice joke.",
          "You drifted through a wormhole for hours to reach the past.",
          "That tear in space is light-years away now.",
          "There is no road back."
        ];
      }

      lines.forEach((line, i) => addTextLine(line, narrativeBox, i * 1500));
      showButton("What? 😱", (lines.length * 1500) + 1000, startPhase1);
    }

    // PHASE 1: VOID REVEAL
    function startPhase1() {
      flashScreen('black');
      clearNarrative();

      const lines = ["YOU", "ARE", "STUCK", "HERE"];
      
      lines.forEach((line, i) => addTextLine(line, narrativeBox, i * 1000, true));
      showButton("This wasn’t supposed to happen…", 5000, startPhase2);
    }

    // PHASE 2: TIME ARRIVES
    function startPhase2() {
      flashScreen('black');
      clearNarrative();
      
      clockContainer.style.display = 'flex';
      void clockContainer.offsetWidth;
      clockContainer.style.opacity = 1;

      currentTickType = 'hostile';
      clockBody.classList.add('shake');
      startTicking(800); 

      clockSpeak([
        "You humans are fascinating.",
        "You don’t just move through me.",
        "You touch me."
      ], startPhase3);
    }

    // PHASE 3: ACTIVE CONVERSATION
    function startPhase3() {
      clockSpeak([
        "Tell me.",
        "Why did you break causality?"
      ], () => {
        showButton("We were trying to understand the universe.", 300, () => {
          clockSpeak([
            "Understanding without restraint is dangerous.",
            "Curiosity created fire.",
            "It also created extinction."
          ], startPhase4);
        });
      });
    }

    // PHASE 4: REVEAL
    function startPhase4() {
      clockBody.style.boxShadow = "0 0 40px rgba(255, 0, 0, 0.9)";
      
      clockSpeak([
        "You bent relativity.",
        "You slipped through wormholes and black holes.",
        "You didn’t just travel...",
        "You manipulated me.",
        "I am not a place.",
        "I am the fourth dimension."
      ], startPhase5);
    }

    // PHASE 5: HUMAN DEFENSE
    function startPhase5() {
      showButton("We didn’t mean to damage anything.", 300, () => {
        
        const oldLines = timeDialogue.querySelectorAll('.fade-line');
        oldLines.forEach(l => l.remove());
        
        const dots = document.createElement('div');
        dots.className = 'thinking';
        dots.innerText = '•••';
        timeDialogue.appendChild(dots);

        setTimeout(() => {
          dots.remove();
          addTextLine("Intent does not erase consequence.", timeDialogue, 0);
          addTextLine("But...", timeDialogue, 2000);
          
          setTimeout(() => {
            addTextLine("Intent still matters.", timeDialogue, 0);
            
            clockBody.classList.add('purple');
            
            setTimeout(startPhase6, 5000);
          }, 4000);
          
        }, 2000);
      });
    }

    // PHASE 6: JUDGEMENT WITH HOPE
    function startPhase6() {
      clockBody.classList.remove('shake');
      currentTickType = 'calm';
      startTicking(1000); 

      clockSpeak([
        "That brain of yours...",
        "It doesn’t belong here.",
        "Use it where it started.",
        "In your original era.",
        "Make something better... instead of breaking me."
      ], () => {
         clockBody.classList.remove('purple');
         clockBody.classList.add('blue');
         
         setTimeout(startPhase7Pre, 4000);
      }, true); 
    }

    // PHASE 7 PRE: PAUSE
    function startPhase7Pre() {
      stopTicking();
      setTimeout(() => {
        showButton("I understand. I won’t try to control you again.", 300, startPhase7Action);
      }, 1000);
    }

    // PHASE 7 ACTION: SPIN
    function startPhase7Action() {
      if(isFuture) {
        clockBody.classList.add('spin-ccw');
      } else {
        clockBody.classList.add('spin-cw');
      }

      travelAudio.currentTime = 0;
      travelAudio.play().catch(e => console.log("Audio play error", e));

      const line = isFuture ? "You will move backward." : "You will move forward.";
      const oldLines = timeDialogue.querySelectorAll('.fade-line');
      oldLines.forEach(l => l.remove());
      addTextLine(line, timeDialogue, 0);

      setTimeout(startPhase8, 3000);
    }

    // PHASE 8: RELEASE
    function startPhase8() {
      travelAudio.pause();
      
      flashOverlay.style.background = "linear-gradient(45deg, #ff0099, #493240, #00f2ff, #fff)";
      flashOverlay.style.opacity = 1;
      
      stage.style.opacity = 0; 
      
      setTimeout(() => {
         flashOverlay.style.opacity = 0;
         cockpitBg.style.opacity = 1;
         finalBtnContainer.style.opacity = 1;
         stage.style.display = 'none';
      }, 4000);
    }

    // --- INIT ---
    window.onload = () => {
      setTimeout(startPhase0, 1000);
    };

  </script>
</body>
</html>
