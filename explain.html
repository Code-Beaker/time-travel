<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Timeline Explanation</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  min-height:100vh;
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
  color:white;
  overflow-y:auto;
}

/* OVERLAY ONLY FOR READABILITY (NO BOXES) */
#overlay{
  min-height:100vh;
  padding:60px 20px 120px;
  background:rgba(0,0,0,0.45);
  display:flex;
  flex-direction:column;
  align-items:center;
}

/* TITLE */
#title{
  font-size:52px;
  font-weight:900;
  margin-bottom:40px;
  opacity:0;
  transition:opacity 1.5s ease;
}

/* TIMELINE */
#timeline{
  max-width:700px;
  text-align:center;
  margin-bottom:40px;
}

.step{
  font-size:22px;
  margin:15px 0;
  opacity:0;
  transition:opacity 1s ease;
}

.arrow{
  font-size:36px;
  margin:5px 0;
  opacity:0;
  transition:opacity 1s ease;
}

/* EXPLANATION */
#explanation{
  max-width:800px;
  font-size:18px;
  line-height:1.7;
  margin-top:30px;
  opacity:0;
  transition:opacity 2s ease;
}

/* FINAL TEXT */
#finalText{
  margin-top:60px;
  font-size:46px;
  font-weight:900;
  opacity:0;
  transition:opacity 2s ease;
}

/* SKY BUTTON */
#skyBtn{
  margin-top:30px;
  padding:14px 30px;
  font-size:18px;
  border:2px solid white;
  background:transparent;
  color:white;
  cursor:pointer;
  border-radius:30px;
  opacity:0;
  transition:opacity 1.5s ease, box-shadow .3s ease;
}
#skyBtn:hover{
  box-shadow:0 0 20px white;
}

/* FONT THEMES */
.past-font{
  font-family: "Times New Roman", serif;
  color:#e6c48a;
}

.future-font{
  font-family: "Courier New", monospace;
  color:#00f2ff;
}

.ultra-future-font{
  font-family: Arial, sans-serif;
  letter-spacing:6px;
  color:#ff00ff;
}
</style>
</head>

<body>
<div id="overlay">

  <div id="title">How did I reach here? 🤔</div>

  <div id="timeline"></div>

  <div id="explanation"></div>

  <div id="finalText"></div>

  <button id="skyBtn">Explore the sky ✨</button>

</div>

<script>
const params = new URLSearchParams(window.location.search);
const year = parseInt(params.get("year"));

const title = document.getElementById("title");
const timeline = document.getElementById("timeline");
const explanation = document.getElementById("explanation");
const finalText = document.getElementById("finalText");
const skyBtn = document.getElementById("skyBtn");

/* BACKGROUND + THEME */
if(year === 1897){
  document.body.style.backgroundImage = "url('images/past_1897.jpg')";
  document.body.classList.add("past-font");
  finalText.innerText = "Welcome to the past";
}
else if(year === 1987){
  document.body.style.backgroundImage = "url('images/past_1987.jpg')";
  document.body.classList.add("past-font");
  finalText.innerText = "Welcome to the past";
}
else if(year === 2050){
  document.body.style.backgroundImage = "url('images/future_2050.jpg')";
  document.body.classList.add("future-font");
  finalText.innerText = "Welcome to the future";
}
else{
  document.body.style.backgroundImage = "url('images/future_3079.jpg')";
  document.body.classList.add("ultra-future-font");
  finalText.innerText = "Welcome to the future";
}

/* TITLE FADE */
setTimeout(()=> title.style.opacity = 1, 300);

/* TIMELINE STEPS (ALL ↓) */
const steps = (year < 2000)
? [
  "We launched from Earth in an experimental spacecraft.",
  "We travelled through deep space and entered a naturally occurring wormhole.",
  "The wormhole distorted space-time and placed us in this era."
]
: [
  "We launched from Earth using relativistic propulsion.",
  "A controlled black hole slingshot bent space-time.",
  "Extreme time dilation carried us into the future."
];

let delay = 1200;

steps.forEach((text, i)=>{
  const step = document.createElement("div");
  step.className = "step";
  step.innerText = text;
  timeline.appendChild(step);

  setTimeout(()=> step.style.opacity = 1, delay);
  delay += 1200;

  if(i < steps.length-1){
    const arrow = document.createElement("div");
    arrow.className = "arrow";
    arrow.innerText = "↓";
    timeline.appendChild(arrow);

    setTimeout(()=> arrow.style.opacity = 1, delay);
    delay += 800;
  }
});

/* EXPLANATION */
setTimeout(()=>{
  explanation.style.opacity = 1;
  explanation.innerText = (year < 2000)
  ? "A wormhole is a theoretical tunnel in space-time predicted by general relativity. Under extreme gravitational conditions, space and time can bend, allowing two distant points — or different eras — to connect through a temporary tear in the fabric of the universe."
  : "A black hole’s immense gravity bends space and time to such extremes that time slows dramatically. By performing a precise gravitational slingshot near its event horizon, massive time dilation occurs, allowing forward travel into the future without violating known physical laws.";
}, delay + 800);

/* FINAL TEXT + BUTTON */
setTimeout(()=>{
  finalText.style.opacity = 1;
  skyBtn.style.opacity = 1;
}, delay + 2600);

</script>
</body>
</html>
