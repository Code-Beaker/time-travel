<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>How did I reach here?</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  min-height:100vh;
  font-family: "Courier New", monospace;
  color:white;
  background-size:cover;
  background-position:center;
  background-attachment:fixed;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  padding:60px 20px;
}

#overlay{
  background:rgba(0,0,0,0.65);
  width:100%;
  max-width:900px;
  padding:50px 30px;
  border-radius:20px;
}

/* TITLE */
#title{
  text-align:center;
  font-size:42px;
  opacity:0;
  transition:opacity 2s ease;
  margin-bottom:50px;
}

/* TIMELINE */
.timeline{
  display:flex;
  flex-direction:column;
  gap:25px;
  font-size:18px;
}

.step{
  opacity:0;
  transition:opacity 1.5s ease;
}

.arrow{
  text-align:center;
  font-size:28px;
  opacity:0;
  transition:opacity 1s ease;
}

/* DESCRIPTION */
#description{
  margin-top:50px;
  font-size:16px;
  line-height:1.7;
  opacity:0;
  transition:opacity 2s ease;
}

/* BIG TEXT */
#bigText{
  margin-top:60px;
  text-align:center;
  font-size:36px;
  letter-spacing:4px;
  opacity:0;
  transition:opacity 2s ease;
}

/* BUTTON */
#skyBtn{
  margin:50px auto 0;
  display:block;
  padding:16px 32px;
  font-size:18px;
  background:transparent;
  border:2px solid white;
  color:white;
  border-radius:40px;
  cursor:pointer;
  opacity:0;
  transition:opacity 2s ease, box-shadow .3s ease;
}

#skyBtn:hover{
  box-shadow:0 0 20px white;
}
</style>
</head>

<body>
<div id="overlay">

  <div id="title">How did I reach here? 🤔</div>

  <div class="timeline">
    <div class="step" id="s1"></div>
    <div class="arrow" id="a1">↓</div>

    <div class="step" id="s2"></div>
    <div class="arrow" id="a2">→</div>

    <div class="step" id="s3"></div>
  </div>

  <div id="description"></div>

  <div id="bigText"></div>

  <button id="skyBtn">Explore the night sky ✨</button>

</div>

<script>
const params = new URLSearchParams(window.location.search);
const year = params.get("year");

/* ---------------- BACKGROUND ---------------- */
if(year == 1897) document.body.style.backgroundImage = "url('images/past_1897.jpg')";
else if(year == 1987) document.body.style.backgroundImage = "url('images/past_1987.jpg')";
else if(year == 2050) document.body.style.backgroundImage = "url('images/future_2050.jpg')";
else if(year == 3079) document.body.style.backgroundImage = "url('images/future_3079.jpg')";

/* ---------------- CONTENT ---------------- */
let steps = [];
let description = "";
let bigText = "";

if(year < 2000){
  // PAST
  steps = [
    "We launched from Earth aboard an experimental spacecraft.",
    "We travelled through space and entered a naturally occurring wormhole located millions of kilometers away.",
    "After passing through the wormhole, we emerged in this past timeline."
  ];

  description = `
A wormhole is a theoretical shortcut through spacetime predicted by Einstein’s theory of General Relativity.
By bending space and time into a tunnel-like structure, it allows two distant points in time to connect.
Extreme gravity, time dilation, and relativistic effects make such travel unstable — but possible in theory.
The journey does not violate physics; it exploits it.
  `;

  bigText = "WELCOME TO THE PAST";
}
else{
  // FUTURE
  steps = [
    "We departed Earth using a relativistic spacecraft.",
    "We performed a gravitational slingshot maneuver around a black hole.",
    "Time dilation shifted us forward, delivering us into the future."
  ];

  description = `
Near a black hole, gravity becomes so intense that time itself slows down.
While years pass elsewhere, only moments pass for the traveler.
Using relativistic speeds and gravitational time dilation, reaching the future requires no paradox — only patience and precision.
  `;

  bigText = "WELCOME TO THE FUTURE";
}

/* ---------------- ANIMATION SEQUENCE ---------------- */
const title = document.getElementById("title");
const s1 = document.getElementById("s1");
const s2 = document.getElementById("s2");
const s3 = document.getElementById("s3");
const a1 = document.getElementById("a1");
const a2 = document.getElementById("a2");
const desc = document.getElementById("description");
const big = document.getElementById("bigText");
const btn = document.getElementById("skyBtn");

s1.innerText = steps[0];
s2.innerText = steps[1];
s3.innerText = steps[2];
desc.innerText = description;
big.innerText = bigText;

setTimeout(()=> title.style.opacity = 1, 500);

setTimeout(()=> s1.style.opacity = 1, 2500);
setTimeout(()=> a1.style.opacity = 1, 4000);

setTimeout(()=> s2.style.opacity = 1, 5200);
setTimeout(()=> a2.style.opacity = 1, 6700);

setTimeout(()=> s3.style.opacity = 1, 8000);

setTimeout(()=> desc.style.opacity = 1, 10000);
setTimeout(()=> big.style.opacity = 1, 12500);
setTimeout(()=> btn.style.opacity = 1, 14500);

/* SKY BUTTON (placeholder) */
btn.onclick = () => {
  alert("Night sky simulation coming next 🌌");
};
</script>

</body>
</html>
